<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080714">
<title>コンサート会場VR</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body style="margin:0;background:#080714">
<a-scene background="color:#090716" fog="type:exponential;color:#100b20;density:.012" renderer="colorManagement:true">
  <a-entity light="type:ambient;color:#55476d;intensity:.8"></a-entity>
  <a-entity light="type:spot;color:#ff398c;intensity:3;angle:35;penumbra:.5;distance:35" position="-5 10 -16" rotation="-28 -18 0"></a-entity>
  <a-entity light="type:spot;color:#42dfff;intensity:2.8;angle:28;penumbra:.5;distance:32" position="5 9 -17" rotation="-25 17 0"></a-entity>
  <a-entity light="type:point;color:#ffb14a;intensity:1.8;distance:14" position="0 3 -15"></a-entity>
  <a-sky color="#090716"></a-sky>
  <a-plane rotation="-90 0 0" width="90" height="90" color="#161221" material="roughness:.8"></a-plane>
  <!-- Arena seating -->
  <a-torus position="0 3 -14" radius="14" radius-tubular=".32" color="#282238" scale="1 .35 1"></a-torus>
  <a-torus position="0 5.2 -15" radius="17" radius-tubular=".38" color="#201b31" scale="1 .38 1"></a-torus>
  <a-cylinder position="0 2.3 -15" radius="17" height=".35" open-ended="true" theta-length="180" rotation="0 180 0" color="#292238" opacity=".8"></a-cylinder>
  <!-- Stage -->
  <a-entity position="0 0 -17">
    <a-box position="0 .65 0" width="13" height="1.3" depth="7" color="#201827" material="metalness:.45;roughness:.35"></a-box>
    <a-box position="0 1.34 -2.5" width="12.5" height=".12" depth=".16" color="#ff4c9c" material="emissive:#ed237a;emissiveIntensity:2"></a-box>
    <a-box position="0 4.3 -3.3" width="10" height="5" color="#1a1024" material="emissive:#30113e;emissiveIntensity:.5"></a-box>
    <a-plane position="0 4.3 -3.2" width="9.7" height="4.7" color="#33113b" material="emissive:#65145e;emissiveIntensity:.7"></a-plane>
    <a-torus position="0 7 -1.8" radius="6.7" radius-tubular=".13" color="#ff4297" scale="1 .25 1" material="emissive:#ff2288;emissiveIntensity:1.3"></a-torus>
    <a-entity position="0 7.2 2">
      <a-box width="15" height=".2" depth=".2" color="#6b6077"></a-box>
      <a-box position="-7.3 -1.4 0" width=".18" height="2.8" depth=".18" color="#625971"></a-box>
      <a-box position="7.3 -1.4 0" width=".18" height="2.8" depth=".18" color="#625971"></a-box>
      <a-cylinder position="-5 -.45 0" radius=".26" height=".4" rotation="0 0 90" color="#ff57b0" material="emissive:#ff238e;emissiveIntensity:2"></a-cylinder>
      <a-cylinder position="-2 -.45 0" radius=".26" height=".4" rotation="0 0 90" color="#68eaff" material="emissive:#16bce3;emissiveIntensity:2"></a-cylinder>
      <a-cylinder position="2 -.45 0" radius=".26" height=".4" rotation="0 0 90" color="#ffcf67" material="emissive:#ffa52c;emissiveIntensity:2"></a-cylinder>
      <a-cylinder position="5 -.45 0" radius=".26" height=".4" rotation="0 0 90" color="#b88aff" material="emissive:#8958ff;emissiveIntensity:2"></a-cylinder>
    </a-entity>
    <a-entity position="0 1.35 0">
      <a-cylinder position="0 1.35 0" radius=".17" height="1.35" color="#100c18"></a-cylinder>
      <a-sphere position="0 2.15 0" radius=".24" color="#17101d"></a-sphere>
      <a-cylinder position="-.35 .62 0" radius=".09" height="1.05" rotation="0 0 25" color="#16101b"></a-cylinder>
      <a-cylinder position=".35 .62 0" radius=".09" height="1.05" rotation="0 0 -25" color="#16101b"></a-cylinder>
      <a-box position=".55 1.25 -.05" width=".08" height="1.05" depth=".08" rotation="0 0 -45" color="#ff70aa"></a-box>
      <a-cylinder position="1.6 .52 .2" radius=".22" height=".75" color="#c74d9a"></a-cylinder>
      <a-torus position="1.6 .92 .2" radius=".25" radius-tubular=".035" color="#ff8fc4"></a-torus>
      <a-cylinder position="-1.5 .7 0" radius=".08" height="1.3" color="#17101b" rotation="0 0 16"></a-cylinder>
    </a-entity>
  </a-entity>
  <!-- Colored beams -->
  <a-cone position="-5 3.8 -14.2" radius-bottom="2.8" radius-top=".08" height="8" rotation="0 0 -10" color="#ed3188" opacity=".15" material="transparent:true;side:double;shader:flat"></a-cone>
  <a-cone position="5 3.8 -14.2" radius-bottom="2.8" radius-top=".08" height="8" rotation="0 0 10" color="#23c9f4" opacity=".14" material="transparent:true;side:double;shader:flat"></a-cone>
  <!-- Audience silhouettes and glowing wristbands -->
  <a-entity id="crowd"></a-entity>
  <a-entity camera look-controls wasd-controls="enabled:false" position="0 1.65 0"></a-entity>
</a-scene>
<script>
let seed=42;
const rand=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
const crowd=document.querySelector('#crowd');
for(let i=0;i<110;i++){
  const angle=(rand()-.5)*2.25;
  const distance=4+rand()*10;
  const x=Math.sin(angle)*distance;
  const z=-Math.cos(angle)*distance-1.5;
  if(Math.abs(x)<1.1&&z<-12)continue;
  const h=.65+rand()*.45;
  const color=['#21182c','#171625','#2b1a31','#191b2a'][i%4];
  const person=document.createElement('a-entity');
  person.setAttribute('position',`${x} ${h/2} ${z}`);
  const body=document.createElement('a-cylinder');
  body.setAttribute('radius',.15+rand()*.12);body.setAttribute('height',h);body.setAttribute('color',color);person.appendChild(body);
  const head=document.createElement('a-sphere');head.setAttribute('position',`0 ${h/2+.15} 0`);head.setAttribute('radius',.16);head.setAttribute('color',color);person.appendChild(head);
  if(i%5===0){const band=document.createElement('a-cylinder');band.setAttribute('position',`.24 ${h*.4} 0`);band.setAttribute('height',.55);band.setAttribute('radius',.035);band.setAttribute('color',i%2?'#ff60a8':'#57dcff');band.setAttribute('material',`emissive:${i%2?'#ff2e8d':'#26bce4'};emissiveIntensity:2`);person.appendChild(band)}
  crowd.appendChild(person);
}
</script>
</body></html>
